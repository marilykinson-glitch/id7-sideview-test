name: build vm-hud esp32 firmware
on:
  push:
    branches: [fw-build]
    paths: ['vm_hud_esp32/**', '.github/workflows/fw.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: esp32 core
        env:
          ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list
      - name: compile
        env:
          ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          set +e
          mkdir -p out
          build() {
            arduino-cli compile --fqbn "$2" --export-binaries --output-dir "build-$1" vm_hud_esp32 > "out/build_$1.log" 2>&1
            echo "rc=$?" >> "out/build_$1.log"
            ls -la "build-$1" >> "out/build_$1.log" 2>&1
            cp "build-$1"/*.merged.bin "out/vm_hud_$1.merged.bin" 2>/dev/null || true
          }
          build esp32s3 "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=disabled"
          build esp32c6 "esp32:esp32:esp32c6:CDCOnBoot=cdc"
          build esp32c3 "esp32:esp32:esp32c3:CDCOnBoot=cdc"
          arduino-cli core list > out/core.txt
          arduino-cli board details --fqbn esp32:esp32:esp32s3 > out/s3-options.txt 2>&1 || true
          (cd out && sha256sum *.bin > SHA256SUMS 2>/dev/null; echo ok >> SHA256SUMS)
      - name: commit binaries
        run: |
          git config user.name "fw-build"
          git config user.email "fw-build@users.noreply.github.com"
          git add out
          git commit -m "firmware binaries ${GITHUB_SHA::7}" || exit 0
          git push
