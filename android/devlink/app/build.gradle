plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'app.devlink'
    compileSdk 34

    defaultConfig {
        applicationId 'app.devlink'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '1.3.0'

        // Chaquopy: nhúng Python để chạy flash/enroll (mgu7) qua ENET
        ndk {
            abiFilters 'arm64-v8a'   // điện thoại thật (Xiaomi 15 Ultra...) là arm64
        }
        python {
            version '3.11'
            buildPython 'python3'
            pip {
                install 'cryptography'
            }
        }
    }

    // chữ ký cố định để bản sau cài đè được lên bản trước (giữ nguyên khóa SSH đã lưu trong máy)
    signingConfigs {
        release {
            storeFile file('devlink.jks')
            storePassword 'devlink-mgu'
            keyAlias 'devlink'
            keyPassword 'devlink-mgu'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.hierynomus:sshj:0.39.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
