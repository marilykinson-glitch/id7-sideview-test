plugins {
    id 'com.android.application'
}

android {
    namespace 'app.devlink'
    compileSdk 34

    defaultConfig {
        applicationId 'app.devlink'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }

    // chữ ký cố định để bản sau cài đè được lên bản trước (giữ nguyên khóa SSH đã lưu trong máy)
    signingConfigs {
        release {
            storeFile file('devlink.jks')
            storePassword 'devlink-mgu'
            keyAlias 'devlink'
            keyPassword 'devlink-mgu'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.hierynomus:sshj:0.39.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
